<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Challenge</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="challenge.css">
</head>
<body class="challenge-body">
  <div class="cw-strip" id="cw-strip">
    <button type="button" class="icon-btn" id="cw-expand" aria-label="Open the challenge">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="cw-strip-title" id="cw-strip-title" data-tauri-drag-region></span>
  </div>
  <header class="cw-head">
    <div class="cw-top" data-tauri-drag-region>
      <span class="cw-lang" data-tauri-drag-region><img id="cw-icon" alt=""><span id="cw-lang"></span></span>
      <span class="cw-buttons">
        <button type="button" class="icon-btn" id="cw-collapse" aria-label="Fold to the side">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" class="icon-btn" id="cw-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <h1 id="cw-title" data-tauri-drag-region>…</h1>
    <div class="cw-tags" id="cw-tags"></div>
  </header>
  <main class="cw-main" id="cw-main">
    <section id="sec-story" hidden><h2>The story</h2><div id="cw-story"></div></section>
    <section id="sec-goal" hidden><h2>Your goal</h2><div id="cw-goal"></div></section>
    <section id="sec-steps" hidden><h2>Step by step</h2><div id="cw-steps"></div></section>
    <section id="sec-hints" class="cw-hints" hidden>
      <h2 id="cw-hints-title">Hints</h2>
      <ol id="cw-hints"></ol>
      <button type="button" class="btn" id="cw-next-hint">Show a hint</button>
    </section>
    <section id="sec-further" hidden><h2>To go further</h2><div id="cw-further"></div></section>
  </main>
  <footer class="cw-foot" id="cw-foot">
    <span class="cw-author" id="cw-author"></span>
    <button type="button" class="btn" id="cw-solution">Show the solution</button>
  </footer>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog" class="dialog-body">
      <h2 id="confirm-title">Show the solution?</h2>
      <p class="lead" id="confirm-text">It replaces the program in the open editor. Save your work first if you want to keep it.</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn">Cancel</button>
        <button type="submit" value="ok" class="btn primary">Replace with the solution</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="i18n-data.js"></script>
  <script src="i18n.js"></script>
  <script src="modes.js"></script>
  <script src="activity-md.js"></script>
  <script src="challenge.js"></script>
</body>
</html>
