[package]
name = "thymio-suite-next"
version = "0.17.0"
description = "Launcher for Thymio II programming environments"
authors = ["Mobsya"]
license = "LGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: right-click > Inspect in test versions, to diagnose problems on testers' PCs
tauri = { version = "2", features = ["devtools"] }
tiny_http = "0.12"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
