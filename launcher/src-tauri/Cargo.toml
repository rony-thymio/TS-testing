[package]
name = "thymio-suite-next"
version = "0.1.0"
description = "Launcher for Thymio II programming environments"
authors = ["Mobsya"]
license = "LGPL-3.0-only"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
