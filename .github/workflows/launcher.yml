# Builds the launcher (Tauri) with the device manager and the VPL3 / Blockly / Scratch web apps
# bundled, and produces unsigned test installers: Windows (.exe setup) and macOS (.dmg).
name: launcher

# To save build minutes: Windows only by default, and the device manager is taken from the latest
# successful build (artifact) instead of being rebuilt. Run manually with "macos: true" for Macs.
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS versions (uses ~10x more build minutes)
        type: boolean
        default: false

jobs:
  app:
    name: Launcher ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.macos && '[{"name":"Windows x64","os":"windows-latest","triple":"x86_64-pc-windows-msvc","tdm":"thymio-device-manager-Windows-X64","ext":".exe","bundles":"nsis,msi"},{"name":"macOS Apple Silicon","os":"macos-latest","triple":"aarch64-apple-darwin","tdm":"thymio-device-manager-macOS-ARM64","ext":"","bundles":"app,dmg"},{"name":"macOS Intel","os":"macos-15-intel","triple":"x86_64-apple-darwin","tdm":"thymio-device-manager-macOS-X64","ext":"","bundles":"app,dmg"}]' || '[{"name":"Windows x64","os":"windows-latest","triple":"x86_64-pc-windows-msvc","tdm":"thymio-device-manager-Windows-X64","ext":".exe","bundles":"nsis,msi"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest device manager build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${{ matrix.tdm }}&per_page=1" --jq '.artifacts[0].id')
          echo "device manager artifact: $id"
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > ../tdm.zip
          mkdir -p ../tdm && unzip -q -o ../tdm.zip -d ../tdm

      - name: Place the device manager next to the launcher
        run: |
          mkdir -p src-tauri/binaries
          cp ../tdm/build/bin/thymio-device-manager${{ matrix.ext }} \
             src-tauri/binaries/thymio-device-manager-${{ matrix.triple }}${{ matrix.ext }}
          chmod +x src-tauri/binaries/*
          ls -l src-tauri/binaries

      - name: Download the web apps (VPL3, Blockly, Scratch)
        run: ./fetch-webapps.sh

      - name: Bundle Thonny with the Thymio plug-in (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "5.0.1"
          Invoke-WebRequest "https://github.com/thonny/thonny/releases/download/v$ver/thonny-$ver-x64.exe" -OutFile thonny-setup.exe
          $dest = Join-Path $PWD "thonny"
          Start-Process -Wait -FilePath .\thonny-setup.exe -ArgumentList "/SP-","/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/NOICONS","/DIR=`"$dest`""
          # tdmclient from GitHub: the PyPI release (0.1.21) fails on Python 3.14 (ast.Num removed);
          # this upstream commit has the fix.
          & "$dest\python.exe" -m pip install --no-warn-script-location --disable-pip-version-check `
            "tdmclient @ git+https://github.com/epfl-mobots/tdm-python@42ef302f2255ff0ede3c4b8e9d5abd1d31f9ad6a" tdmclient_ty
          # Thymio Suite's version of the plug-in: uses the robot chosen in Thymio Suite (launcher/patches/tdmclient_ty).
          $plugin = & "$dest\python.exe" -c "import os, thonnycontrib.tdmclient_ty as m; print(os.path.dirname(m.__file__))"
          Copy-Item patches\tdmclient_ty\__init__.py (Join-Path $plugin "__init__.py") -Force
          Remove-Item (Join-Path $plugin "__pycache__") -Recurse -Force -ErrorAction SilentlyContinue
          & "$dest\python.exe" -c "import thonnycontrib.tdmclient_ty, tdmclient; print('plug-in OK')"
          & "$dest\python.exe" -c "from tdmclient.atranspiler import ATranspiler; t=ATranspiler(); t.set_source('leds_top = [32, 0, 0]'); t.transpile(); print(t.get_output())"
          Remove-Item thonny-setup.exe
          Get-ChildItem $dest | Select-Object -First 15 Name

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: launcher/src-tauri }

      - name: Generate icons
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/app-icon.png

      - name: Build
        # test-tools: right-click > Inspect in test versions only (see Cargo.toml).
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }} --features test-tools

      # What a school IT department does: silent install for all users, then uninstall. Checks the
      # files, the firewall rule, and that nothing is left behind. Reported in the build summary.
      - name: Installation test (silent MSI and .exe, firewall rule, uninstall)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $rule = "Thymio Suite device manager"
          $report = @("## Installation test")
          function Check($ok, $text) { $script:report += $(if ($ok) { "- ✅ $text" } else { "- ❌ $text" }); if (-not $ok) { $script:failed = $true } }
          function RuleExists { netsh advfirewall firewall show rule name="$rule" | Out-Null; return ($LASTEXITCODE -eq 0) }
          function Installed($dir) { return (Test-Path "$dir\thymio-device-manager.exe") -and (Test-Path "$dir\thonny\thonny.exe") -and ((Get-ChildItem "$dir\*.exe" | Where-Object { $_.Name -like "Thymio*Suite*" }).Count -gt 0) }
          $dir = "$env:ProgramFiles\Thymio Suite Next"

          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v msi-install.log" -Wait -PassThru
          Check ($p.ExitCode -eq 0) "MSI: silent install (msiexec /i … /qn), exit code $($p.ExitCode)"
          Check (Installed $dir) "MSI: files in $dir"
          Check (RuleExists) "MSI: firewall rule added"
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait -PassThru
          Check ($p.ExitCode -eq 0) "MSI: silent uninstall, exit code $($p.ExitCode)"
          Check (-not (Test-Path "$dir\thymio-device-manager.exe")) "MSI: no files left"
          Check (-not (RuleExists)) "MSI: firewall rule removed"

          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList "/S /P" -Wait -PassThru
          Check ($p.ExitCode -eq 0) ".exe: silent install for all users (/S /P), exit code $($p.ExitCode)"
          Check (Installed $dir) ".exe: files in $dir"
          Check (RuleExists) ".exe: firewall rule added"
          $un = Get-ChildItem "$dir\uninstall*.exe" | Select-Object -First 1
          if ($un) { $p = Start-Process $un.FullName -ArgumentList "/S" -Wait -PassThru; Start-Sleep -Seconds 5 }
          Check (-not (Test-Path "$dir\thymio-device-manager.exe")) ".exe: no files left after silent uninstall"
          Check (-not (RuleExists)) ".exe: firewall rule removed"

          $report -join "`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $report -join "`n"
          if ($failed) { if (Test-Path msi-install.log) { Get-Content msi-install.log -Tail 40 }; exit 1 }

      # Parts list (SBOM, CycloneDX) of everything the installer contains: Rust crates, the Python
      # packages bundled with Thonny, the web apps. Needed for the EU Cyber Resilience Act, and
      # scanned for known security flaws in the release job.
      - name: Parts list (SBOM)
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: launcher
          config: launcher/.syft.yaml
          format: cyclonedx-json
          output-file: launcher/sbom.cdx.json
          upload-artifact: false

      - name: Upload parts list
        if: runner.os == 'Windows'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: thymio-suite-next-sbom
          path: launcher/sbom.cdx.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: thymio-suite-next-${{ matrix.triple }}
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/bundle/msi/*.msi
            launcher/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Publishes each test version on the repository's Releases page: one direct download per system.
  release:
    name: Publish test release
    needs: app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: thymio-suite-next-*
          path: dist
          merge-multiple: true
      # Known security flaws in the bundled parts: reported in the build summary, not blocking yet.
      - name: Check the parts list for known security flaws
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@v6
        with:
          sbom: dist/sbom.cdx.json
          fail-build: false
          severity-cutoff: high
          output-format: table
      - name: Security report in the build summary
        if: always()
        continue-on-error: true
        run: |
          echo "## Known security flaws in the bundled parts" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "${{ steps.scan.outputs.report }}" ]; then echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "${{ steps.scan.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; else echo "No report (scan did not run)." >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Create or replace the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['version'])")
          tag="v${version}-test"
          # Simple file names without spaces, one per system.
          mkdir -p out
          find dist -type f -name '*.exe' -exec cp {} "out/ThymioSuiteNext-${version}-windows-x64-setup.exe" \;
          find dist -type f -name '*.msi' -exec cp {} "out/ThymioSuiteNext-${version}-windows-x64.msi" \;
          find dist -type f -name '*aarch64*.dmg' -exec cp {} "out/ThymioSuiteNext-${version}-macos-apple-silicon.dmg" \;
          find dist -type f -name '*x64*.dmg' -exec cp {} "out/ThymioSuiteNext-${version}-macos-intel.dmg" \;
          [ -f dist/sbom.cdx.json ] && cp dist/sbom.cdx.json "out/ThymioSuiteNext-${version}-sbom.cdx.json"
          ls -l out
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --target "${{ github.sha }}" \
            --title "Thymio Suite Next ${version} (test version)" \
            --notes "Test version for evaluation only. Not signed yet: Windows Smart App Control must be off to run it. See docs/test-log.md." \
            out/*
